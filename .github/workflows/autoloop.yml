name: Master Autoloop - LaLiga + Ligue1

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC = Settlement
    - cron: '0 18 * * 5'  # Friday 18:00 UTC = Fetch Weekend
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send a delivery-test message to Telegram (no odds needed)'
        required: false
        default: 'false'
        type: boolean

jobs:
  autoloop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch real odds (The Odds API)
        if: ${{ secrets.THE_ODDS_API_KEY != '' }}
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python fetch_odds.py

      - name: Telegram delivery test (manual trigger)
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python autoloop_master.py --telegram-test

      - name: Run autoloop_master.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python autoloop_master.py
          echo "=== Ledger ==="
          head -n 20 paper_trading_ledger_2026.csv
          cat telegram_last_report.txt

      - name: Commit & Push ledger updates
        run: |
          git config --global user.name "hermes-bot"
          git config --global user.email "hermes@bot.local"
          git add paper_trading_ledger_2026.csv telegram_last_report.txt autoloop_last_run.json || true
          git diff --staged --quiet || git commit -m "auto: update ledger $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || echo "No push needed or no remote"
